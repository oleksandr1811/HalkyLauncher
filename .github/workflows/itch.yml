name: Publish to itch.io

on:
  release:
    types: [ released ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.2.3)"
        required: true
        type: string

permissions: { }

jobs:
  itch:
    name: Push to itch.io via butler
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      VERSION: ${{ github.event.release.tag_name || inputs.tag }}
      ITCH_GAME: halkylauncher
      ITCH_USER: halkylauncher

    steps:
      - name: Resolve release tag & download assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Видаляємо файли минулого релізу
          rm -rf release-assets push

          TAG="${{ env.VERSION }}"
          # Нормалізуємо тег: пробуємо як є, з "v", і без "v"
          for CANDIDATE in "$TAG" "v${TAG}" "${TAG#v}"; do
            if gh release view "$CANDIDATE" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Found release tag: $CANDIDATE"
              echo "RELEASE_TAG=$CANDIDATE" >> "$GITHUB_ENV"
              break
            fi
          done

          test -n "${RELEASE_TAG}" || { echo "::error::Release not found for tag '$TAG'"; exit 1; }
          gh release download "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --dir release-assets \
            --clobber

      # ── Windows MSVC (x64 Setup) ────────────────────────────────────────────
      - name: Prepare Windows MSVC
        run: |
          mkdir -p push/windows-msvc
          cp release-assets/HalkyLauncher-Windows-MSVC-Setup-${{ env.RELEASE_TAG }}.exe \
             push/windows-msvc/

      # ── Linux AppImage (x86_64) ─────────────────────────────────────────────
      - name: Prepare Linux AppImage x86_64
        run: |
          mkdir -p push/linux-appimage
          cp release-assets/HalkyLauncher-Linux-x86_64.AppImage \
             push/linux-appimage/

      # ── macOS ───────────────────────────────────────────────────────────────
      - name: Prepare macOS
        run: |
          mkdir -p push/macos
          cp release-assets/HalkyLauncher-macOS-${{ env.RELEASE_TAG }}.zip \
             push/macos/

      # ── Install butler ──────────────────────────────────────────────────────
      - name: Install butler
        run: |
          curl -L -o butler.zip \
            "https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default"
          unzip butler.zip
          chmod +x butler
          ./butler -V

      # ── Push all channels ───────────────────────────────────────────────────
      - name: Push Windows MSVC to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler push push/windows-msvc \
            "${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:windows-msvc" \
            --userversion "${{ env.RELEASE_TAG }}"

      - name: Push Linux AppImage to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler push push/linux-appimage \
            "${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:linux-appimage" \
            --userversion "${{ env.RELEASE_TAG }}"

      - name: Push macOS to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./butler push push/macos \
            "${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:osx" \
            --userversion "${{ env.RELEASE_TAG }}"
