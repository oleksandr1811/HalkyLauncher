name: Publish to Snap Store

on:
  release:
    types: [ released ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  snap:
    name: Build & push snap to Snap Store
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          REF=""
          for CANDIDATE in "$TAG" "v${TAG}" "${TAG#v}"; do
            if gh release view "$CANDIDATE" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Found release tag: $CANDIDATE"
              REF="$CANDIDATE"
              break
            fi
          done
          test -n "$REF" || { echo "::error::Release not found for tag '$TAG'"; exit 1; }
          echo "RESOLVED_REF=$REF" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1
        with:
          path: .

      - name: Review snap
        run: |
          sudo snap install review-tools
          review-tools-snap-review "${{ steps.build.outputs.snap }}"

      - name: Publish snap to Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
